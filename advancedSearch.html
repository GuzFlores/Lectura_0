<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link rel="stylesheet" href="advanced.css">
    </head>
    <body>
        <nav class="navegacion">
            <ul class="nav nav-underline">
                <li class="nav-item">
                    <a class="nav-link  " aria-current="page" href="index.html">Buscador</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fs-1" href="imagesSearch.html">Buscar Imágenes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active " href="advancedSearch.html">Búsqueda Avanzada</a>
                </li>
                <!-- <li class="nav-item">
                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li> -->
            </ul>
        </nav>
        <div class="contenedor">
            <form class="form" action="https://www.google.com/search" method="get"> 
                <h1 class="h1">Búsqueda Avanzada</h1>
                <h2>Mostrar páginas que contengan:</h2>
                <div class="elementos mb-3">
                    <label for="tePalabras" class="form-label">Todas estas <br>palabras:</label>
                    <input type="text" class="text" name="as_q" id="tePalabras" >
                </div>
                <div class="elementos mb-3">
                    <label for="fraseE" class="form-label">Esta palabra o <br>frase exacta:</label>
                    <input type="text" class="text" name="as_epq" id="fraseE" >
                </div>
                
                <div class="elementos mb-3">
                    <label for="algunaPal" class="form-label">Cualquiera de <br>estas palabras:</label>
                    <input type="text" class="text" name="as_oq" id="algunaPal" >
                </div>
                <div class="elementos mb-3">
                    <label for="ningPal" class="form-label">Ninguna de <br>estas palabras:</label>
                    <input type="text" class="text" name="as_eq" id="ningPal" >
                </div>
                <button type="submit" class="btn-solid theme-primary">Búsqueda Avanzada</button>
                </form>
            </div>
        </div>
    </body>
</html>
